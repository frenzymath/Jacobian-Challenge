name = "jacobian_library"
version = "0.1.0"
defaultTargets = ["Solution"]
moreLeanArgs = ["-j2"]

[leanOptions]
autoImplicit = false
pp.unicode.fun = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"

[[lean_lib]]
name = "Jacobian"

[[lean_lib]]
name = "Challenge"
moreLeanArgs = ["-Dbackward.isDefEq.respectTransparency.types=false"]

[[lean_lib]]
name = "Solution"
