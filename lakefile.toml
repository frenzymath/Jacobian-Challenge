name = "jacobian_library"
version = "0.1.0"
defaultTargets = ["Solution"]
moreLeanArgs = ["-j2"]

[leanOptions]
autoImplicit = false
pp.unicode.fun = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "b63f6e8a68d220e3b3bc4f3792bb53650d375f24"

[[lean_lib]]
name = "Jacobian"

[[lean_lib]]
name = "Challenge"
moreLeanArgs = ["-Dbackward.isDefEq.respectTransparency.types=false"]

[[lean_lib]]
name = "Solution"
